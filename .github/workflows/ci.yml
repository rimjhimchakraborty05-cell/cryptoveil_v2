name: CryptoVeil quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check agent tests scripts desktop_app.py run.py setup_desktop_shortcuts.py
      - name: Test
        run: python -m pytest -q
      - name: Check browser code
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check dashboard/js/dashboard.js
      - name: Test extension delivery
        run: node --test tests/extension.test.mjs

  windows-build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install desktop build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6,<7"
      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean CryptoVeil.spec
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: CryptoVeil-Windows
          path: dist/CryptoVeil/
          if-no-files-found: error
          retention-days: 14

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=360, initial-scale=1.0"/>
  <title>CryptoVeil</title>
  <link rel="stylesheet" href="popup.css"/>
</head>
<body>
  <div id="popup">

    <!-- Header -->
    <header id="popup-header">
      <div class="header-brand">
        <img src="icons/icon48.png" alt="CryptoVeil" class="header-icon"/>
        <div>
          <h1>CryptoVeil</h1>
          <span class="subtitle">Real-Time Security</span>
        </div>
      </div>
      <div class="conn-indicator" id="conn-status">
        <div class="conn-dot"></div>
        <span id="conn-text">OFFLINE</span>
      </div>
    </header>

    <!-- Monitored Account & Email Section -->
    <section class="account-section" id="account-section">
      <div class="account-header">
        <div class="account-title">
          <span class="account-icon">👤</span>
          <span>MONITORED EMAIL ID</span>
        </div>
        <button class="btn-change-account" id="btn-toggle-account-edit" title="Switch or select active browser email">Switch</button>
      </div>
      <div class="account-current" id="account-current-display">
        <div class="account-email" id="acc-display-email">Detecting browser account…</div>
        <div class="account-browser-badge" id="acc-display-browser">Auto</div>
      </div>
      
      <!-- Account Picker Drawer (Collapsible) -->
      <div class="account-picker" id="account-picker" style="display:none;">
        <label class="picker-label" for="profile-select">Select Detected Browser Profile / Email:</label>
        <select id="profile-select" class="popup-select">
          <option value="">Scanning detected email IDs…</option>
        </select>
        <div class="custom-email-row" id="custom-email-row" style="display:none;margin-top:6px;">
          <input type="email" id="custom-email-input" class="popup-input" placeholder="Or enter specific email address"/>
        </div>
        <div class="picker-actions">
          <button class="btn-save-account" id="btn-save-account">Save Account</button>
          <button class="btn-cancel-account" id="btn-cancel-account">Cancel</button>
        </div>
      </div>
    </section>

    <!-- Trust Score Section -->
    <section class="score-section" id="score-section">
      <div class="score-ring-container">
        <svg viewBox="0 0 120 120" class="score-ring">
          <circle class="ring-bg" cx="60" cy="60" r="52" />
          <circle class="ring-fg" id="score-ring-fg" cx="60" cy="60" r="52" />
        </svg>
        <div class="score-value" id="score-value">—</div>
      </div>
      <div class="score-meta">
        <div class="score-label">TRUST SCORE</div>
        <div class="score-hostname" id="score-hostname">No site loaded</div>
        <div class="score-verdict" id="score-verdict">—</div>
      </div>
    </section>

    <!-- Reasons -->
    <section class="reasons-section" id="reasons-section" style="display:none;">
      <div class="section-label">RISK FACTORS</div>
      <ul id="reasons-list"></ul>
    </section>

    <!-- Protection Toggles -->
    <section class="toggles-section">
      <div class="section-label">ACTIVE PROTECTIONS</div>
      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-icon">🔒</span>
          <span>Value Obfuscation</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-obfuscation" checked/>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-icon">👁</span>
          <span>Visual Masking</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-masking"/>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-icon">🤖</span>
          <span>Shadow AI Monitor</span>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-shadowai" checked/>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </section>

    <!-- Recent Alerts -->
    <section class="alerts-section">
      <div class="section-label">RECENT ALERTS</div>
      <div id="alerts-list">
        <div class="empty-alerts">No alerts this session</div>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <button class="btn-dashboard" id="btn-dashboard">
        <span>📊</span> Open Dashboard
      </button>
      <div class="footer-version">v2.0.0</div>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
